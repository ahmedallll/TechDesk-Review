name: Build TechDesk Scanner APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt
          test -s "$GITHUB_WORKSPACE/debug.keystore" || { echo "debug.keystore generation failed" >&2; exit 1; }
          ls -la "$GITHUB_WORKSPACE/debug.keystore"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licences
        run: yes | sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain assembleDebug 2>&1 | tee gradle-assembleDebug.log

      - name: Verify Debug APK Output
        run: |
          if [ ! -s "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: app/build/outputs/apk/debug/app-debug.apk does not exist or is empty" >&2
            exit 1
          fi
          echo "Verified APK exists and is non-empty:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TechDesk-Scanner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Diagnostics on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-diagnostics
          path: |
            gradle-assembleDebug.log
            app/build/reports/
            **/build/reports/
          if-no-files-found: warn
          retention-days: 7
